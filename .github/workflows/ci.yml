name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:run
      - run: npm run build

  backend:
    name: Backend (lint, test, import, health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and integration tests (pytest)
        run: pytest -q
      - name: Import app and count routes
        run: python -c "from app.main import app; print(len(app.routes))"
      - name: Boot server and probe /health
        run: |
          uvicorn app.main:app --port 8000 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:8000/health | grep -q '"status":"ok"' && echo OK
          kill "$SERVER_PID"

  state-coverage:
    name: State coverage (all four states per data region)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run state-coverage suite (fails if any region lacks all four states)
        run: npx vitest --run __tests__/state-coverage.test.tsx

  e2e-live:
    name: E2E (journeys against live backend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Migrate and seed a throwaway database
        working-directory: backend
        env:
          DATABASE_PATH: ${{ runner.temp }}/e2e-live.db
        run: |
          python3 -m db.migrate
          python3 -m db.seed
      - name: Boot API and wait for /health (fails if it does not come up)
        working-directory: backend
        env:
          DATABASE_PATH: ${{ runner.temp }}/e2e-live.db
        run: |
          uvicorn app.main:app --port 8000 > "${{ runner.temp }}/e2e-live-backend.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/e2e-live-backend.pid"
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null 2>&1; then
              echo "backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy in 30s" >&2
          cat "${{ runner.temp }}/e2e-live-backend.log" >&2
          exit 1
      - name: Run e2e-live journeys (MSW disabled, real fetch)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_MOCK: "off"
          E2E_LIVE: "1"
        run: |
          set -o pipefail
          npx vitest --run --project=e2e-live 2>&1 | tee "${{ runner.temp }}/e2e-live.log"
      - name: Stop backend
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/e2e-live-backend.pid" ]; then
            kill "$(cat "${{ runner.temp }}/e2e-live-backend.pid")" 2>/dev/null || true
          fi
      - name: Upload e2e-live output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-output
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/e2e-live.log
            ${{ runner.temp }}/e2e-live-backend.log
