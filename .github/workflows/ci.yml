name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend (install, import, health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Import app and count routes
        run: python -c "from app.main import app; print(len(app.routes))"
      - name: Boot server and probe /health
        run: |
          uvicorn app.main:app --port 8000 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:8000/health | grep -q '"status":"ok"' && echo OK
          kill "$SERVER_PID"

  state-coverage:
    name: State coverage (all four states per data region)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run state-coverage suite (fails if any region lacks all four states)
        run: npx vitest --run __tests__/state-coverage.test.tsx
