<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital MS — Pro Max prototype viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html, body { height: 100%; }
  .stage {
    background:
      linear-gradient(45deg, rgb(var(--s2)) 25%, transparent 25%, transparent 75%, rgb(var(--s2)) 75%) 0 0/22px 22px,
      linear-gradient(45deg, rgb(var(--s2)) 25%, transparent 25%, transparent 75%, rgb(var(--s2)) 75%) 11px 11px/22px 22px;
  }
  .seg[aria-pressed="true"] { background: rgb(var(--primary)); color: rgb(var(--primary-fg)); }
  .rail-item[aria-current="true"] { background: rgb(var(--primary-container)); color: rgb(var(--primary-container-fg)); font-weight: 600; }
</style>
</head>
<body class="bg-background text-foreground antialiased h-full">

<div class="flex h-full flex-col">

  <!-- ─────────────────── Top bar ─────────────────── -->
  <header class="shrink-0 h-14 bg-surface-1 border-b border-outline flex items-center gap-2 px-3 sm:px-4 z-nav">
    <div class="flex items-center gap-2.5 min-w-0">
      <span class="w-8 h-8 shrink-0 rounded-lg bg-primary text-primary-foreground grid place-items-center">
        <i data-lucide="cross" class="w-4.5 h-4.5" aria-hidden="true"></i></span>
      <span class="leading-tight min-w-0 hidden sm:block">
        <span class="block text-base font-semibold font-display truncate">Hospital MS · Pro Max</span>
        <span class="block text-2xs text-muted truncate">Phase 1 UX prototype</span>
      </span>
    </div>

    <span class="flex-1"></span>

    <!-- Compare toggle: the whole point of this folder existing -->
    <button type="button" id="cmpBtn" aria-pressed="false"
      class="inline-flex items-center gap-1.5 h-10 px-3 rounded-lg border border-outline-strong bg-surface-0 text-base font-medium hover:bg-surface-2 press">
      <i data-lucide="columns-2" class="w-4 h-4" aria-hidden="true"></i>
      <span class="hidden sm:inline">Compare with original</span><span class="sm:hidden">Compare</span>
    </button>

    <!-- Viewport -->
    <div id="vps" class="hidden md:flex items-center gap-0.5 rounded-lg bg-surface-2 border border-outline p-0.5" role="group" aria-label="Viewport width">
      <button type="button" data-vp="375" class="seg h-9 px-2.5 rounded-md text-xs font-semibold num press" aria-pressed="false" title="375px — small phone">375</button>
      <button type="button" data-vp="768" class="seg h-9 px-2.5 rounded-md text-xs font-semibold num press" aria-pressed="false" title="768px — tablet">768</button>
      <button type="button" data-vp="1024" class="seg h-9 px-2.5 rounded-md text-xs font-semibold num press" aria-pressed="false" title="1024px — small laptop">1024</button>
      <button type="button" data-vp="1440" class="seg h-9 px-2.5 rounded-md text-xs font-semibold num press" aria-pressed="false" title="1440px — desktop">1440</button>
      <button type="button" data-vp="full" class="seg h-9 px-2.5 rounded-md text-xs font-semibold press" aria-pressed="true" title="Fill the stage">Full</button>
    </div>

    <!-- Density -->
    <button type="button" id="denBtn" class="w-11 h-11 rounded-lg grid place-items-center text-muted hover:bg-surface-2 press" aria-label="Toggle row density" aria-pressed="false">
      <i data-lucide="rows-3" class="w-5 h-5" aria-hidden="true"></i></button>
    <!-- Theme -->
    <button type="button" id="thBtn" class="w-11 h-11 rounded-lg grid place-items-center text-muted hover:bg-surface-2 press" aria-label="Toggle dark mode">
      <i data-lucide="moon-star" class="w-5 h-5" aria-hidden="true"></i></button>
    <!-- Open -->
    <a id="openNew" href="01-signin.html" target="_blank" rel="noopener"
      class="w-11 h-11 rounded-lg grid place-items-center text-muted hover:bg-surface-2 press" aria-label="Open this page in a new tab">
      <i data-lucide="external-link" class="w-5 h-5" aria-hidden="true"></i></a>
  </header>

  <div class="flex flex-1 min-h-0">
    <!-- ─────────────────── Page rail ─────────────────── -->
    <nav aria-label="Prototype pages" class="hidden lg:flex flex-col w-64 shrink-0 bg-surface-1 border-r border-outline">
      <div class="flex-1 overflow-y-auto p-2">
        <ul id="rail" class="space-y-0.5"></ul>
      </div>
      <div class="p-3 border-t border-outline space-y-1.5 text-2xs text-muted">
        <p class="flex items-center gap-1.5"><kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">↑ ↓</kbd> or <kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">1-9</kbd> switch page</p>
        <p class="flex items-center gap-1.5"><kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">c</kbd> compare · <kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">t</kbd> theme · <kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">v</kbd> density</p>
        <p class="flex items-center gap-1.5"><kbd class="num px-1 py-0.5 rounded bg-surface-3 border border-outline">m/s/l/d/f</kbd> viewport</p>
      </div>
    </nav>

    <div class="flex-1 min-w-0 flex flex-col">
      <!-- Mobile page picker -->
      <div class="lg:hidden shrink-0 p-2 bg-surface-1 border-b border-outline">
        <label for="railMobile" class="sr-only">Choose a prototype page</label>
        <select id="railMobile" class="w-full min-h-11 rounded-lg bg-surface-2 border border-outline-strong px-3 text-base"></select>
      </div>

      <!-- Change note for the current page -->
      <div class="shrink-0 px-3 sm:px-4 py-2 bg-surface-2/60 border-b border-outline flex items-start gap-2">
        <i data-lucide="sparkles" class="w-4 h-4 text-primary shrink-0 mt-0.5" aria-hidden="true"></i>
        <p id="note" class="text-base min-w-0" aria-live="polite"></p>
      </div>

      <!-- ─────────────────── Stage ─────────────────── -->
      <main class="flex-1 min-h-0 stage overflow-auto p-3">
        <div id="panes" class="h-full flex gap-3 justify-center items-stretch">

          <figure id="paneA" class="flex flex-col min-w-0 h-full m-0" style="width:100%">
            <figcaption class="shrink-0 flex items-center gap-2 mb-1.5">
              <span class="inline-flex items-center gap-1.5 text-2xs font-semibold px-2 py-1 rounded-md bg-primary text-primary-foreground">
                <i data-lucide="sparkles" class="w-3 h-3" aria-hidden="true"></i>Pro Max</span>
              <span id="capA" class="text-2xs text-muted num truncate"></span>
            </figcaption>
            <div class="flex-1 min-h-0 rounded-xl border border-outline bg-background overflow-hidden shadow-raised">
              <iframe id="frameA" src="01-signin.html" title="Pro Max prototype" class="w-full h-full block" style="border:0"></iframe>
            </div>
          </figure>

          <figure id="paneB" class="flex-col min-w-0 h-full m-0 hidden" style="width:50%">
            <figcaption class="shrink-0 flex items-center gap-2 mb-1.5">
              <span class="inline-flex items-center gap-1.5 text-2xs font-semibold px-2 py-1 rounded-md bg-surface-3 text-muted">
                <i data-lucide="history" class="w-3 h-3" aria-hidden="true"></i>Original</span>
              <span id="capB" class="text-2xs text-muted num truncate"></span>
            </figcaption>
            <div class="flex-1 min-h-0 rounded-xl border border-outline bg-background overflow-hidden">
              <iframe id="frameB" title="Original ux-prototype" class="w-full h-full block" style="border:0"></iframe>
            </div>
          </figure>
        </div>
      </main>
    </div>
  </div>
</div>

<script>
/**
 * Prototype viewer.
 *
 * Two panes over the same page number: the Pro Max build on the left, the original
 * ux-prototype on the right. Page numbering is deliberately identical between the
 * two folders so a comparison is always like-for-like.
 *
 * Theme and density are broadcast into both iframes, so a dark-mode comparison is
 * a fair one.
 */
const PAGES = [
  ['01-signin.html', 'Sign in', 'auth', 'Split trust panel, blur-time validation with fix-it copy, Caps-Lock hint, and role jump cards separated from the real form.'],
  ['02-admin-dashboard.html', 'Admin dashboard', 'admin', 'Six-tile KPI strip with sparklines and signed deltas, keyboard-reorderable widget grid with admin locks, and three accessible charts with table alternatives.'],
  ['03-patient-list.html', 'Patient directory', 'shared', 'Dense sortable table with aria-sort, derived facet counts, saved views, bulk actions with Undo, and a card fallback under 768px instead of sideways scroll.'],
  ['04-patient-detail.html', 'Patient record', 'shared', 'Allergy band above the fold, cross-department timeline with additive filters and department tags, vitals chart with a reference band.'],
  ['05-appointment-booking.html', 'Appointment booking', 'reception', 'Three-step flow with a live summary rail; duplicate detection blocks before save, and conflicting slots are unreachable rather than rejected after submit.'],
  ['06-doctor-schedule.html', 'Doctor schedule', 'doctor', 'Real time-axis day view with a now-line and visible gaps, week view with capacity bars, and blocked periods explained rather than merely greyed.'],
  ['07-record-entry.html', 'Visit note', 'doctor', 'Autosaving draft with a stated save state, ICD-10 combobox, prescription repeater with a hard allergy contraindication check, and a focus-managed error summary.'],
  ['08-billing.html', 'Billing & claims', 'billing', 'Invoice list plus detail, claim lifecycle stepper with the denial reason and appeal deadline, and payment entry that refuses to exceed the balance.'],
  ['09-admin-users.html', 'Admin · Users', 'admin', 'Two-factor coverage as a first-class column, role-change escalation warning, and every destructive action reversible from its toast.'],
  ['10-admin-departments.html', 'Admin · Departments', 'admin', 'Capacity meters with the number on the label, coverage-minimum warnings, and a bed-reduction guard that refuses to strand admitted patients.'],
  ['11-admin-widget-library.html', 'Admin · Widget library', 'admin', 'Two independent switches per widget, role-default matrix, dashboard preview per role, and nothing committed until published.'],
  ['12-admin-permissions.html', 'Admin · Permissions', 'admin', 'Checkbox matrix with real labels, view-dependency enforcement, a diff review before saving, and a plain-English read-back of each role.'],
  ['13-receptionist-dashboard.html', 'Receptionist dashboard', 'reception', 'Walk-in queue with running wait clocks and acuity escalation, plus payment collection and department wait times.'],
  ['14-doctor-dashboard.html', 'Doctor dashboard', 'doctor', 'Today\'s clinic, records past the 72-hour signing policy, and an unattended-appointment alert with a one-click reassign.'],
  ['15-nurse-dashboard.html', 'Nurse dashboard', 'nurse', 'Shift-shaped: assigned beds with allergy flags, inline vitals entry with plausibility bounds, and a care plan with a completion meter.'],
];

const TAG = {
  auth: 'bg-surface-3 text-muted',
  admin: 'bg-danger-container text-danger-container-foreground',
  shared: 'bg-info-container text-info-container-foreground',
  reception: 'bg-warning-container text-warning-container-foreground',
  doctor: 'bg-success-container text-success-container-foreground',
  nurse: 'bg-primary-container text-primary-container-foreground',
  billing: 'bg-warning-container text-warning-container-foreground',
};

const ORIGINAL = '../../ux-prototype/prototype/';
const ROLE_FOR = { '02-admin-dashboard.html': 'Admin', '13-receptionist-dashboard.html': 'Receptionist', '14-doctor-dashboard.html': 'Doctor', '15-nurse-dashboard.html': 'Nurse' };

let current = 0, compare = false, vp = 'full';

const $ = (s) => document.querySelector(s);
const rail = $('#rail'), railMobile = $('#railMobile');
const frameA = $('#frameA'), frameB = $('#frameB');
const paneA = $('#paneA'), paneB = $('#paneB');

PAGES.forEach(([file, label, tag], i) => {
  const li = document.createElement('li');
  li.innerHTML = `<button type="button" data-i="${i}" aria-current="${i === 0}"
    class="rail-item w-full text-left rounded-lg px-2.5 min-h-11 flex items-center gap-2.5 text-base hover:bg-surface-3 press">
    <span class="num w-6 h-6 shrink-0 rounded-md bg-surface-2 border border-outline grid place-items-center text-2xs font-semibold">${String(i + 1).padStart(2, '0')}</span>
    <span class="flex-1 truncate">${label}</span>
    <span class="text-2xs px-1.5 py-0.5 rounded-full shrink-0 ${TAG[tag] || ''}">${tag}</span>
  </button>`;
  rail.appendChild(li);

  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${String(i + 1).padStart(2, '0')} · ${label}`;
  railMobile.appendChild(opt);
});

function go(i) {
  current = (i + PAGES.length) % PAGES.length;
  const [file, label, , note] = PAGES[current];
  const role = ROLE_FOR[file];
  const qs = role ? `?role=${role}` : '';

  frameA.src = file + qs;
  if (compare) frameB.src = ORIGINAL + file;
  $('#openNew').href = file + qs;
  railMobile.value = current;
  $('#note').innerHTML = `<strong class="font-semibold">${label}:</strong> <span class="text-muted">${note}</span>`;
  $('#capA').textContent = `promax-prototype/prototype/${file}`;
  $('#capB').textContent = `ux-prototype/prototype/${file}`;

  document.querySelectorAll('.rail-item').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.i === current)));
  document.querySelectorAll('.rail-item')[current]?.scrollIntoView({ block: 'nearest' });
  pushPrefs();
}

rail.addEventListener('click', (e) => { const b = e.target.closest('.rail-item'); if (b) go(+b.dataset.i); });
railMobile.addEventListener('change', (e) => go(+e.target.value));

/* ── Compare mode ── */
function setCompare(on) {
  compare = on;
  const btn = $('#cmpBtn');
  btn.setAttribute('aria-pressed', String(on));
  btn.classList.toggle('!bg-primary', on);
  btn.classList.toggle('!text-primary-foreground', on);
  btn.classList.toggle('!border-transparent', on);
  paneB.classList.toggle('hidden', !on);
  paneB.classList.toggle('flex', on);
  if (on) {
    frameB.src = ORIGINAL + PAGES[current][0];
    // Compare mode always fills the stage; a fixed device width would leave the
    // panes too narrow to read side by side.
    vp = 'full';
    syncVpButtons();
  }
  applyVp();
  UIAnnounce(on ? 'Compare mode on — Pro Max left, original right' : 'Compare mode off');
}
$('#cmpBtn').addEventListener('click', () => setCompare(!compare));

/* ── Viewport ── */
function applyVp() {
  if (compare) {
    paneA.style.width = '50%';
    paneB.style.width = '50%';
    paneA.style.maxWidth = paneB.style.maxWidth = 'none';
    return;
  }
  paneA.style.width = vp === 'full' ? '100%' : vp + 'px';
  paneA.style.maxWidth = '100%';
}
function syncVpButtons() {
  document.querySelectorAll('[data-vp]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vp === vp)));
}
document.querySelectorAll('[data-vp]').forEach((b) => b.addEventListener('click', () => {
  vp = b.dataset.vp;
  if (compare) setCompare(false);
  syncVpButtons(); applyVp();
}));

/* ── Prefs, pushed into both panes ── */
function pushPrefs() {
  const msg = { type: 'promax:prefs', theme: PromaxTheme.themePref, density: PromaxTheme.density };
  [frameA, frameB].forEach((f) => {
    if (!f.src) return;
    const send = () => { try { f.contentWindow.postMessage(msg, '*'); } catch {} };
    f.addEventListener('load', send, { once: true });
    send();
  });
}
function syncPrefButtons() {
  const dark = PromaxTheme.theme === 'dark';
  $('#thBtn').innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon-star'}" class="w-5 h-5" aria-hidden="true"></i>`;
  $('#thBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  const compact = PromaxTheme.density === 'compact';
  $('#denBtn').setAttribute('aria-pressed', String(compact));
  $('#denBtn').classList.toggle('text-primary', compact);
  $('#denBtn').title = compact ? 'Density: compact. Click for comfortable.' : 'Density: comfortable. Click for compact.';
  lucide.createIcons({ nameAttr: 'data-lucide' });
}
$('#thBtn').addEventListener('click', () => { PromaxTheme.toggleTheme(); syncPrefButtons(); pushPrefs(); });
$('#denBtn').addEventListener('click', () => { PromaxTheme.toggleDensity(); syncPrefButtons(); pushPrefs(); });
// A pane can also change the prefs from inside; mirror it here and to the other pane.
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'promax:prefs') { syncPrefButtons(); pushPrefs(); }
});

function UIAnnounce(msg) { $('#live').textContent = msg; }

/* ── Keyboard ── */
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k >= '1' && k <= '9') { go(+k - 1); }
  else if (k === '0') { go(9); }
  else if (k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); go(current + 1); }
  else if (k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
  else if (k === 'c') { setCompare(!compare); }
  else if (k === 't') { PromaxTheme.toggleTheme(); syncPrefButtons(); pushPrefs(); }
  else if (k === 'v') { PromaxTheme.toggleDensity(); syncPrefButtons(); pushPrefs(); }
  else if (k === 'm') { vp = '375'; if (compare) setCompare(false); syncVpButtons(); applyVp(); }
  else if (k === 's') { vp = '768'; if (compare) setCompare(false); syncVpButtons(); applyVp(); }
  else if (k === 'l') { vp = '1024'; if (compare) setCompare(false); syncVpButtons(); applyVp(); }
  else if (k === 'd') { vp = '1440'; if (compare) setCompare(false); syncVpButtons(); applyVp(); }
  else if (k === 'f') { vp = 'full'; if (compare) setCompare(false); syncVpButtons(); applyVp(); }
});

document.body.insertAdjacentHTML('beforeend', '<div id="live" class="sr-only" role="status" aria-live="polite"></div>');
syncPrefButtons();
syncVpButtons();
applyVp();
go(0);
lucide.createIcons({ nameAttr: 'data-lucide' });
</script>
</body>
</html>
